      - "pure-sql3/**"
      - "pure-stldict/**"
      - "pure-stllib/**"
      - "pure-xml/**"
      - "pure-gsl/**"
      - "pure-glpk/**"
      - "pure-odbc/**"
      - "pure-audio/**"
      - "pure-midi/**"
      - "pure-gl/**"
