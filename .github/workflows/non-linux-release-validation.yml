name: Non-Linux release validation

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "todo/**"
    paths:
      - "pure/**"
      - "pure-faust/**"
      - "pure-reduce/**"
      - ".github/workflows/non-linux-release-validation.yml"
  pull_request:
    branches:
      - master
    paths:
      - "pure/**"
      - "pure-faust/**"
      - "pure-reduce/**"
      - ".github/workflows/non-linux-release-validation.yml"

concurrency:
  group: non-linux-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: pure

jobs:
  windows-pure-reduce:
    name: Windows PureReduce package
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: source with spaces
    env:
      CMAKE_EXE: C:/msys64/clang64/bin/cmake.exe
      CTEST_EXE: C:/msys64/clang64/bin/ctest.exe
      LLVM_READOBJ_EXE: C:/msys64/clang64/bin/llvm-readobj.exe
      REDUCE_COMMIT: 7efba90661139ae9c73c99fddd55f3fb2fabf69a
      REDUCE_TREE: 5573613a2f86efea75695fbe65a73317383884c1

    steps:
      - name: Check out source in a path containing spaces
        uses: actions/checkout@v4
        with:
          path: source with spaces

      - name: Fully update MSYS2 and install the CLANG64 build prerequisites
        id: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          release: false
          install: >-
            autoconf-wrapper
            autoconf2.73
            automake-wrapper
            automake1.18
            libtool
            make
            bison
            flex
            diffutils
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-gcc-compat
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-gmp
            mingw-w64-clang-x86_64-mpfr
            mingw-w64-clang-x86_64-readline
            mingw-w64-clang-x86_64-pcre
            mingw-w64-clang-x86_64-libiconv
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-ncurses

      - name: Verify the selected CLANG64 build tools
        run: |
          $ErrorActionPreference = 'Stop'
          $msys2Root = '${{ steps.setup-msys2.outputs.msys2-location }}'.Replace('\', '/').TrimEnd('/')
          if ($msys2Root -ine 'C:/msys64') {
            throw "setup-msys2 selected an unexpected root: $msys2Root"
          }
          # The Actions runner prepends GITHUB_PATH entries in reverse write order.
          'C:/msys64/usr/bin' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:/msys64/clang64/bin' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "C:/msys64/clang64/bin;C:/msys64/usr/bin;$env:PATH"
          $expectedTools = [ordered]@{
            ninja = 'C:/msys64/clang64/bin/ninja.exe'
            bison = 'C:/msys64/usr/bin/bison.exe'
            flex = 'C:/msys64/usr/bin/flex.exe'
            pkgconf = 'C:/msys64/clang64/bin/pkgconf.exe'
          }
          foreach ($tool in $expectedTools.Keys) {
            $command = Get-Command $tool -CommandType Application `
              -ErrorAction Stop | Select-Object -First 1
            $actual = $command.Source.Replace('\', '/')
            if ($actual -ine $expectedTools[$tool]) {
              throw "$tool resolved outside C:/msys64: $actual"
            }
            & $actual --version
            if ($LASTEXITCODE -ne 0) { throw "$tool version probe failed" }
          }
          & C:/msys64/usr/bin/bash.exe --noprofile --norc -c @'
          set -euxo pipefail
          export MSYSTEM=CLANG64
          export PATH=/clang64/bin:/usr/bin
          export WANT_AUTOCONF=2.73
          autoconf --version | sed -n '1p'
          automake --version | sed -n '1p'
          libtool --version | sed -n '1p'
          make --version | sed -n '1p'
          clang --version | sed -n '1p'
          g++ --version | sed -n '1p'
          '@
          if ($LASTEXITCODE -ne 0) { throw "CLANG64 tool probe failed" }

      - name: Fetch and verify the exact REDUCE source
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Get-Location).Path
          $source = Join-Path $repo 'build/deps/REDUCE source with spaces'
          New-Item -ItemType Directory `
            -Path (Split-Path $source -Parent) -Force | Out-Null
          git -C (Split-Path $source -Parent) init (Split-Path $source -Leaf)
          if ($LASTEXITCODE -ne 0) { throw "REDUCE repository initialization failed" }
          git -C $source config remote.origin.url `
            https://github.com/reduce-algebra/reduce-algebra.git
          if ($LASTEXITCODE -ne 0) { throw "REDUCE remote URL setup failed" }
          git -C $source config remote.origin.tagOpt --no-tags
          if ($LASTEXITCODE -ne 0) { throw "REDUCE remote tag policy setup failed" }
          git -C $source config core.autocrlf false
          git -C $source config remote.origin.promisor true
          git -C $source config remote.origin.partialclonefilter blob:none
          git -C $source fetch --depth=1 --filter=blob:none --no-tags origin `
            7efba90661139ae9c73c99fddd55f3fb2fabf69a
          if ($LASTEXITCODE -ne 0) { throw "REDUCE exact-commit fetch failed" }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "REDUCE checkout failed" }
          $actualCommit = (git -C $source rev-parse HEAD).Trim()
          $actualTree = (git -C $source rev-parse 'HEAD^{tree}').Trim()
          $status = git -C $source status --short
          if ($actualCommit -ne $env:REDUCE_COMMIT) {
            throw "REDUCE commit mismatch: $actualCommit"
          }
          if ($actualTree -ne $env:REDUCE_TREE) {
            throw "REDUCE tree mismatch: $actualTree"
          }
          if ($status) { throw "REDUCE checkout is dirty: $status" }
          $fetchRefspec = @(git -C $source config --get-all remote.origin.fetch)
          if ($LASTEXITCODE -notin @(0, 1)) {
            throw "REDUCE fetch-refspec query failed"
          }
          if ($fetchRefspec.Count -ne 0) {
            throw "REDUCE remote retained a branch fetch refspec: $fetchRefspec"
          }
          $remoteRefs = @(git -C $source for-each-ref `
            --format='%(refname)' refs/remotes/)
          if ($LASTEXITCODE -ne 0) { throw "REDUCE remote-ref query failed" }
          if ($remoteRefs.Count -ne 0) {
            throw "REDUCE fetch created remote-tracking refs: $remoteRefs"
          }
          $gitBytes = (Get-ChildItem -LiteralPath (Join-Path $source '.git') `
            -File -Recurse -Force | Measure-Object Length -Sum).Sum
          "REDUCE_SOURCE=$($source.Replace('\', '/'))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REDUCE_FETCH_BYTES=$gitBytes" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and install the Windows Pure runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Get-Location).Path
          $pureBuild = Join-Path $repo 'build/windows pure release'
          $purePrefix = Join-Path $repo 'build/windows pure prefix'
          & $env:CMAKE_EXE -S pure -B $pureBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=C:/msys64/clang64/bin/clang.exe `
            -DCMAKE_CXX_COMPILER=C:/msys64/clang64/bin/clang++.exe `
            -DLLVM_DIR=C:/msys64/clang64/lib/cmake/llvm `
            "-DCMAKE_INSTALL_PREFIX=$purePrefix" `
            -DPURE_STRICT_TOOLCHAIN=ON
          if ($LASTEXITCODE -ne 0) { throw "Pure configure failed" }
          & $env:CMAKE_EXE --build $pureBuild --parallel 1
          if ($LASTEXITCODE -ne 0) { throw "Pure build failed" }
          & $env:CMAKE_EXE --install $pureBuild
          if ($LASTEXITCODE -ne 0) { throw "Pure install failed" }
          "PURE_EXECUTABLE=$($purePrefix.Replace('\', '/'))/bin/pure.exe" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and build PureReduce
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Get-Location).Path
          $build = Join-Path $repo 'build/windows PureReduce release'
          & $env:CMAKE_EXE -S pure-reduce -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=C:/msys64/clang64/bin/clang++.exe `
            "-DPURE_REDUCE_SOURCE_DIR=$env:REDUCE_SOURCE" `
            -DPURE_REDUCE_MSYS2_BASH=C:/msys64/usr/bin/bash.exe `
            -DPURE_REDUCE_MAKE=C:/msys64/usr/bin/make.exe `
            "-DPURE_EXECUTABLE=$env:PURE_EXECUTABLE" `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "PureReduce configure failed" }
          & $env:CMAKE_EXE --build $build --parallel 1
          if ($LASTEXITCODE -ne 0) { throw "PureReduce build failed" }
          "PURE_REDUCE_BUILD=$($build.Replace('\', '/'))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run the complete PureReduce test suite
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:CTEST_EXE --test-dir $env:PURE_REDUCE_BUILD `
            -L reduce --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "PureReduce CTest failed" }

      - name: Install and verify only the PureReduce component
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Get-Location).Path
          $stage = Join-Path $env:PURE_REDUCE_BUILD 'staged PureReduce package'
          & $env:CMAKE_EXE `
            "-DBUILD_DIR=$env:PURE_REDUCE_BUILD" `
            "-DSTAGE_PREFIX=$stage" `
            "-DAUTHORITATIVE_MANIFEST=$env:PURE_REDUCE_BUILD/PureReduceExpected.sha256" `
            "-DPURE_EXECUTABLE=$env:PURE_EXECUTABLE" `
            "-DLLVM_READOBJ=$env:LLVM_READOBJ_EXE" `
            "-DSOURCE_PREFIX=$repo/pure-reduce" `
            -P pure-reduce/cmake/VerifyInstalledPackage.cmake
          if ($LASTEXITCODE -ne 0) {
            throw "installed PureReduce verification failed"
          }
          "PURE_REDUCE_STAGE=$($stage.Replace('\', '/'))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Independently verify packaged rolling-toolchain provenance
        run: |
          $ErrorActionPreference = 'Stop'
          $metricsPath = Join-Path $env:PURE_REDUCE_STAGE `
            'share/doc/pure-reduce/pure-reduce-package-metrics.json'
          $metrics = Get-Content -LiteralPath $metricsPath -Raw | ConvertFrom-Json
          $expectedPackages = @(
            'mingw-w64-clang-x86_64-zlib',
            'mingw-w64-clang-x86_64-ncurses',
            'mingw-w64-clang-x86_64-winpthreads',
            'mingw-w64-clang-x86_64-libc++',
            'mingw-w64-clang-x86_64-libunwind',
            'mingw-w64-clang-x86_64-compiler-rt',
            'mingw-w64-clang-x86_64-crt'
          )
          $records = @($metrics.toolchain_packages)
          if ($records.Count -ne $expectedPackages.Count) {
            throw "installed metrics have $($records.Count) toolchain records"
          }
          $sharedDriverTrace = (& C:/msys64/clang64/bin/clang++.exe `
            -### -shared -x c++ NUL -o NUL 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or
              $sharedDriverTrace -notmatch '[/\\]dllcrt2\.o(?:"|\s|$)') {
            throw 'CLANG64 shared-link driver trace does not select dllcrt2.o'
          }
          '| Package | Exact rolling version | Link input SHA-256 |' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          '| --- | --- | --- |' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          for ($index = 0; $index -lt $expectedPackages.Count; $index++) {
            $record = $records[$index]
            $package = $expectedPackages[$index]
            if ($record.package -cne $package) {
              throw "unexpected toolchain package at index ${index}: $($record.package)"
            }
            $query = (& C:/msys64/usr/bin/pacman.exe -Q $package).Trim()
            if ($LASTEXITCODE -ne 0) { throw "pacman query failed for $package" }
            $fields = $query -split ' ', 2
            if ($fields.Count -ne 2 -or $fields[0] -cne $package -or
                $fields[1] -cne $record.version) {
              throw "live/package version mismatch for ${package}: $query vs $($record.version)"
            }
            $input = Join-Path 'C:/msys64/clang64' `
              $record.link_input.path.Replace('/', [IO.Path]::DirectorySeparatorChar)
            if (-not (Test-Path -LiteralPath $input -PathType Leaf)) {
              throw "recorded toolchain input is missing: $input"
            }
            $inputHash = (Get-FileHash -LiteralPath $input -Algorithm SHA256).Hash.ToLowerInvariant()
            $inputOwner = (& C:/msys64/usr/bin/pacman.exe -Qqo $input).Trim()
            if ($LASTEXITCODE -ne 0 -or $inputOwner -cne $package -or
                $record.link_input.owner -cne $package -or
                $inputHash -cne $record.link_input.sha256) {
              throw "live link-input provenance mismatch for $package"
            }
            foreach ($notice in @($record.notices)) {
              $systemNotice = Join-Path 'C:/msys64/clang64' `
                $notice.system_path.Replace('/', [IO.Path]::DirectorySeparatorChar)
              $vendoredNotice = Join-Path $env:PURE_REDUCE_STAGE `
                "share/doc/pure-reduce/licenses/$($notice.vendored_path)"
              $noticeOwner = (& C:/msys64/usr/bin/pacman.exe -Qqo $systemNotice).Trim()
              $systemHash = (Get-FileHash -LiteralPath $systemNotice -Algorithm SHA256).Hash.ToLowerInvariant()
              $vendoredHash = (Get-FileHash -LiteralPath $vendoredNotice -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($LASTEXITCODE -ne 0 -or $noticeOwner -cne $package -or
                  $systemHash -cne $notice.sha256 -or
                  $vendoredHash -cne $notice.sha256) {
                throw "live/vendored notice provenance mismatch for $package"
              }
            }
            "| ``$package`` | ``$($record.version)`` | ``$inputHash`` |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Create the deterministic PureReduce ZIP and record its hash
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDirectory = Join-Path (Get-Location).Path 'build/pure-reduce-artifacts'
          $archive = Join-Path $artifactDirectory 'windows-pure-reduce.zip'
          $listFile = Join-Path $artifactDirectory 'archive-files.txt'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          $files = Get-ChildItem -LiteralPath $env:PURE_REDUCE_STAGE -File -Recurse
          if ($files.Count -ne 85) { throw "unexpected staged file count: $($files.Count)" }
          $packageMetrics = Get-Content -LiteralPath `
            (Join-Path $env:PURE_REDUCE_STAGE `
              'share/doc/pure-reduce/pure-reduce-package-metrics.json') `
            -Raw | ConvertFrom-Json
          if ($files.Count -ne $packageMetrics.installed_file_count) {
            throw "staged/metrics file-count mismatch: $($files.Count) vs $($packageMetrics.installed_file_count)"
          }
          [string[]]$relativeFiles = $files | ForEach-Object {
            [IO.Path]::GetRelativePath($env:PURE_REDUCE_STAGE, $_.FullName).Replace('\', '/')
          }
          [Array]::Sort($relativeFiles, [StringComparer]::Ordinal)
          $relativeFiles | Out-File -LiteralPath $listFile -Encoding utf8
          Add-Type -AssemblyName System.IO.Compression
          $archiveStream = [IO.File]::Open(
            $archive, [IO.FileMode]::Create, [IO.FileAccess]::Write,
            [IO.FileShare]::None)
          $zip = [IO.Compression.ZipArchive]::new(
            $archiveStream, [IO.Compression.ZipArchiveMode]::Create, $false)
          try {
            foreach ($relative in $relativeFiles) {
              $source = Join-Path $env:PURE_REDUCE_STAGE `
                $relative.Replace('/', [IO.Path]::DirectorySeparatorChar)
              $entry = $zip.CreateEntry(
                $relative, [IO.Compression.CompressionLevel]::Optimal)
              $entry.LastWriteTime = [DateTimeOffset]'2000-01-01T00:00:00+00:00'
              $inputStream = [IO.File]::OpenRead($source)
              $entryStream = $entry.Open()
              try {
                $inputStream.CopyTo($entryStream)
              } finally {
                $entryStream.Dispose()
                $inputStream.Dispose()
              }
            }
          } finally {
            $zip.Dispose()
            $archiveStream.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $metrics = Get-Content -LiteralPath `
            "$env:PURE_REDUCE_BUILD/PureReducePackageMetrics.json" -Raw |
            ConvertFrom-Json
          $stageBytes = ($files | Measure-Object Length -Sum).Sum
          $archiveBytes = (Get-Item -LiteralPath $archive).Length
          Write-Host "windows-pure-reduce.zip SHA-256: $hash"
          @"
          ### Windows PureReduce package

          - REDUCE fetch bytes: $env:REDUCE_FETCH_BYTES
          - canonical source bytes: $($metrics.upstream_source_bytes)
          - upstream build-tree bytes: $($metrics.upstream_build_tree_bytes)
          - upstream build elapsed seconds: $($metrics.upstream_build_elapsed_seconds)
          - upstream workers: 1
          - selected CSL objects: $($metrics.link_object_count)
          - installed files: $($files.Count)
          - installed bytes: $stageBytes
          - ZIP bytes: $archiveBytes
          - inner ZIP SHA-256: ``$hash``
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload the PureReduce package
        id: upload-pure-reduce
        uses: actions/upload-artifact@v4
        with:
          name: windows-pure-reduce
          path: source with spaces/build/pure-reduce-artifacts/windows-pure-reduce.zip
          if-no-files-found: error

      - name: Record the CI artifact digest
        run: |
          $ErrorActionPreference = 'Stop'
          $digest = '${{ steps.upload-pure-reduce.outputs.artifact-digest }}'
          if (-not $digest) { throw "upload-artifact did not report a digest" }
          Write-Host "windows-pure-reduce artifact digest: $digest"
          "- upload-artifact digest: ``$digest``" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  windows-pure-faust:
    name: Windows pure-faust (${{ matrix.selection }})
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - selection: Runtime
            ctest-label: runtime
            expect-developer: "OFF"
            artifact-name: windows-pure-faust-runtime
          - selection: Runtime+FaustDeveloper
            ctest-label: faust
            expect-developer: "ON"
            artifact-name: windows-pure-faust-full
    defaults:
      run:
        shell: pwsh
        working-directory: source with spaces
    env:
      CMAKE_EXE: C:/msys64/clang64/bin/cmake.exe
      CTEST_EXE: C:/msys64/clang64/bin/ctest.exe
      CLANG_EXE: C:/msys64/clang64/bin/clang.exe
      OPT_EXE: C:/msys64/clang64/bin/opt.exe
      PKG_CONFIG_EXE: C:/msys64/clang64/bin/pkgconf.exe
      FAUST_URL: https://github.com/grame-cncm/faust/releases/download/2.85.9/Faust-2.85.9-win64.exe
      FAUST_SHA256: d0994eb444ab4b1e75e3ed7c31897da24013db0672e2c6be8f2ab09b73d16977

    steps:
      - name: Check out source in a path containing spaces
        uses: actions/checkout@v4
        with:
          path: source with spaces

      - name: Install the CLANG64 build prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          & C:/msys64/usr/bin/bash.exe -lc @'
          set -euxo pipefail
          pacman --noconfirm -Sy --needed \
            bison flex diffutils \
            mingw-w64-clang-x86_64-clang \
            mingw-w64-clang-x86_64-llvm \
            mingw-w64-clang-x86_64-cmake \
            mingw-w64-clang-x86_64-ninja \
            mingw-w64-clang-x86_64-pkgconf \
            mingw-w64-clang-x86_64-gmp \
            mingw-w64-clang-x86_64-mpfr \
            mingw-w64-clang-x86_64-readline \
            mingw-w64-clang-x86_64-pcre \
            mingw-w64-clang-x86_64-libiconv
          '@
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 package setup failed" }
          'C:/msys64/clang64/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:/msys64/usr/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify bootstrap tool discovery
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            bison = 'C:/msys64/usr/bin/bison.exe'
            flex = 'C:/msys64/usr/bin/flex.exe'
            pkgconf = 'C:/msys64/clang64/bin/pkgconf.exe'
          }
          foreach ($tool in $expected.Keys) {
            $actual = (Get-Command $tool -CommandType Application -ErrorAction Stop).Source.Replace('\', '/')
            if ($actual -ne $expected[$tool]) {
              throw "$tool resolved outside the selected MSYS2 prefix: $actual"
            }
            & $actual --version
            if ($LASTEXITCODE -ne 0) { throw "$tool version probe failed" }
          }

          $expectedPackages = @(
            'mingw-w64-clang-x86_64-headers 14.0.0.r262.g5ea8e9fac-1'
            'mingw-w64-clang-x86_64-crt 14.0.0.r262.g5ea8e9fac-1'
            'mingw-w64-clang-x86_64-libffi 3.8.0-1'
          )
          foreach ($expectedPackage in $expectedPackages) {
            $package = $expectedPackage.Split(' ')[0]
            $actualPackage = (& C:/msys64/usr/bin/pacman.exe -Q $package).Trim()
            if ($LASTEXITCODE -ne 0) { throw "$package query failed" }
            if ($actualPackage -ne $expectedPackage) {
              throw "$package resolved to '$actualPackage' instead of '$expectedPackage'"
            }
          }

      - name: Fetch and verify the official Faust 2.85.9 payload
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Join-Path $env:RUNNER_TEMP 'Faust-2.85.9-win64.exe'
          $faustRoot = Join-Path $env:RUNNER_TEMP 'Faust 2.85.9 extracted'
          Invoke-WebRequest -Uri $env:FAUST_URL -OutFile $asset
          $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:FAUST_SHA256) {
            throw "Faust asset SHA-256 mismatch: $actual"
          }
          New-Item -ItemType Directory -Path $faustRoot -Force | Out-Null
          & 7z.exe x $asset "-o$faustRoot" -y
          if ($LASTEXITCODE -ne 0) { throw "Faust data-only extraction failed" }
          & (Join-Path $faustRoot 'bin/faust.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "Extracted Faust version probe failed" }
          "FAUST_ROOT=$($faustRoot.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assert the Windows install rules exclude the legacy bridge
        run: |
          $ErrorActionPreference = 'Stop'
          $installRules = Get-Content -LiteralPath 'pure-faust/cmake/Install.cmake' -Raw
          foreach ($forbidden in @('faust.cc', 'faust.pure', 'pure.cpp', 'faust.dll')) {
            if ($installRules -match [regex]::Escape($forbidden)) {
              throw "Windows install rule selects forbidden legacy input: $forbidden"
            }
          }

      - name: Build and install the Windows Pure runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Get-Location).Path
          $pureBuild = Join-Path $repo 'build/windows pure release'
          $purePrefix = Join-Path $repo 'build/windows pure prefix'
          $faust = Join-Path $env:FAUST_ROOT 'bin/faust.exe'
          & $env:CMAKE_EXE -S pure -B $pureBuild -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=C:/msys64/clang64/bin/clang.exe `
            -DCMAKE_CXX_COMPILER=C:/msys64/clang64/bin/clang++.exe `
            -DLLVM_DIR=C:/msys64/clang64/lib/cmake/llvm `
            "-DCMAKE_INSTALL_PREFIX=$purePrefix" `
            "-DPURE_FAUST_EXECUTABLE=$faust" `
            -DPURE_STRICT_TOOLCHAIN=ON
          if ($LASTEXITCODE -ne 0) { throw "Pure configure failed" }
          & $env:CMAKE_EXE --build $pureBuild --parallel 1
          if ($LASTEXITCODE -ne 0) { throw "Pure build failed" }
          & $env:CMAKE_EXE --install $pureBuild
          if ($LASTEXITCODE -ne 0) { throw "Pure install failed" }
          "PURE_BUILD=$($pureBuild.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PURE_PREFIX=$($purePrefix.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure and build pure-faust
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = (Get-Location).Path
          $build = Join-Path $repo "build/pure-faust ${{ matrix.selection }}"
          $fixture = Join-Path $env:PURE_BUILD 'test/faust/reference.bc'
          $arguments = @(
            '-S', 'pure-faust', '-B', $build, '-G', 'Ninja',
            "-DCMAKE_PREFIX_PATH=$env:PURE_PREFIX",
            "-DPKG_CONFIG_EXECUTABLE=$env:PKG_CONFIG_EXE",
            "-DPURE_FAUST_CORE_FIXTURE=$fixture"
          )
          if ('${{ matrix.expect-developer }}' -eq 'ON') {
            $arguments += @(
              "-DPURE_FAUST_FAUST_ROOT=$env:FAUST_ROOT",
              "-DPURE_FAUST_CLANG=$env:CLANG_EXE",
              "-DPURE_FAUST_OPT=$env:OPT_EXE"
            )
          }
          $env:PKG_CONFIG_PATH = "$env:PURE_PREFIX/lib/pkgconfig"
          & $env:CMAKE_EXE @arguments
          if ($LASTEXITCODE -ne 0) { throw "pure-faust configure failed" }
          & $env:CMAKE_EXE --build $build
          if ($LASTEXITCODE -ne 0) { throw "pure-faust build failed" }
          "PURE_FAUST_BUILD=$($build.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage ${{ matrix.selection }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path (Get-Location).Path "build/staged ${{ matrix.selection }}"
          & $env:CMAKE_EXE --install $env:PURE_FAUST_BUILD --prefix $stage --component Runtime
          if ($LASTEXITCODE -ne 0) { throw "Runtime staging failed" }
          if ('${{ matrix.expect-developer }}' -eq 'ON') {
            & $env:CMAKE_EXE --install $env:PURE_FAUST_BUILD --prefix $stage --component FaustDeveloper
            if ($LASTEXITCODE -ne 0) { throw "FaustDeveloper staging failed" }
          }
          $installed = Get-ChildItem -LiteralPath $stage -File -Recurse
          foreach ($forbidden in @('faust.cc', 'faust.pure', 'pure.cpp', 'faust.dll', 'msys-2.0.dll')) {
            if ($installed.Name -contains $forbidden) {
              throw "Staged selection contains forbidden file: $forbidden"
            }
          }
          if ('${{ matrix.expect-developer }}' -eq 'OFF') {
            foreach ($developerTool in @('faust.exe', 'clang.exe', 'opt.exe')) {
              if ($installed.Name -contains $developerTool) {
                throw "Runtime selection contains developer tool: $developerTool"
              }
            }
          }
          "PURE_FAUST_STAGE=$($stage.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run ${{ matrix.ctest-label }} CTests with sanitized PATH
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$env:PURE_FAUST_STAGE/bin;$env:SystemRoot/System32/WindowsPowerShell/v1.0;$env:SystemRoot/System32;$env:SystemRoot"
          Remove-Item Env:PURELIB -ErrorAction SilentlyContinue
          & $env:CTEST_EXE --test-dir $env:PURE_FAUST_BUILD `
            -L '${{ matrix.ctest-label }}' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "pure-faust CTest failed" }

      - name: Archive the staged selection and record its hash
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDirectory = Join-Path (Get-Location).Path 'build/pure-faust-artifacts'
          $archive = Join-Path $artifactDirectory '${{ matrix.artifact-name }}.zip'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          Compress-Archive -Path "$env:PURE_FAUST_STAGE/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "${{ matrix.selection }} archive SHA-256: ``$hash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload the staged selection
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: source with spaces/build/pure-faust-artifacts/${{ matrix.artifact-name }}.zip
          if-no-files-found: error

  macos-15-arm64:
    name: macOS 15 arm64
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_BUILD: build/native-release
      DEBUG_BUILD: build/native-debug
      INSTALL_PREFIX: ${{ github.workspace }}/build/native-prefix
      LOG_DIR: build/native-logs/macos-15-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Initialize validation logs
        run: mkdir -p "$LOG_DIR"

      - name: Install LLVM 22 and dependencies
        run: |
          set -euxo pipefail
          {
            brew update
            brew install llvm@22 bison flex pkgconf gmp mpfr readline pcre
            echo "LLVM_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"
            echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
            echo "PATH=$(brew --prefix llvm@22)/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH" >> "$GITHUB_ENV"
            echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm@22);$(brew --prefix gmp);$(brew --prefix mpfr);$(brew --prefix readline);$(brew --prefix pcre)" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=$(brew --prefix gmp)/lib/pkgconfig:$(brew --prefix mpfr)/lib/pkgconfig:$(brew --prefix readline)/lib/pkgconfig:$(brew --prefix pcre)/lib/pkgconfig" >> "$GITHUB_ENV"
          } 2>&1 | tee "$LOG_DIR/homebrew-setup.log"

      - name: Record host and toolchain evidence
        run: |
          set -euxo pipefail
          {
            uname -a
            uname -m
            sw_vers
            brew config
            clang --version
            clang -dumpmachine
            llvm-config --version
            llvm-config --host-target
            llvm-config --bindir
            pkg-config --version
            for package in gmp mpfr readline libpcreposix; do
              pkg-config --modversion "$package"
              pkg-config --variable=prefix "$package"
            done
            test "$(uname -m)" = arm64
            case "$(clang -dumpmachine)" in
              arm64-apple-*|aarch64-apple-*) ;;
              *) exit 1 ;;
            esac
            case "$(llvm-config --host-target)" in
              arm64-apple-*|aarch64-apple-*) ;;
              *) exit 1 ;;
            esac
            case "$(llvm-config --version)" in
              22.*) ;;
              *) exit 1 ;;
            esac
            case "$LLVM_PREFIX" in
              /opt/homebrew/*) ;;
              *) exit 1 ;;
            esac
          } 2>&1 | tee "$LOG_DIR/host-toolchain.log"

      - name: Configure Release
        run: |
          set -euxo pipefail
          cmake -S . -B "$RELEASE_BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DPURE_STRICT_TOOLCHAIN=ON \
            2>&1 | tee "$LOG_DIR/configure-release.log"

      - name: Build Release
        run: |
          set -euxo pipefail
          cmake --build "$RELEASE_BUILD" --parallel 1 \
            2>&1 | tee "$LOG_DIR/build-release.log"

      - name: Run focused Release tests
        run: |
          set -euxo pipefail
          ctest --test-dir "$RELEASE_BUILD" -E pure-regression \
            --output-on-failure 2>&1 | tee "$LOG_DIR/ctest-release-focused.log"

      - name: Run complete Release tests
        run: |
          set -euxo pipefail
          ctest --test-dir "$RELEASE_BUILD" --output-on-failure \
            2>&1 | tee "$LOG_DIR/ctest-release-complete.log"

      - name: Validate Release object formats
        run: |
          set -euxo pipefail
          assert_arm64_macho() {
            file -L "$1" | grep -F "Mach-O"
            test "$(lipo -archs "$1")" = arm64
          }
          {
            assert_arm64_macho "$RELEASE_BUILD/pure"
            for runtime in "$RELEASE_BUILD"/libpure*.dylib; do
              assert_arm64_macho "$runtime"
            done
            assert_arm64_macho "$RELEASE_BUILD/test/pure-batch-smoke.o"
            assert_arm64_macho "$RELEASE_BUILD/test/pure-batch-program"
          } 2>&1 | tee "$LOG_DIR/release-object-formats.log"

      - name: Install and validate programs
        run: |
          set -euxo pipefail
          cmake --install "$RELEASE_BUILD" \
            2>&1 | tee "$LOG_DIR/install.log"
          installed_pkg_config="$INSTALL_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          {
            env -u DYLD_LIBRARY_PATH "$INSTALL_PREFIX/bin/pure" --version
            env -u DYLD_LIBRARY_PATH "$INSTALL_PREFIX/bin/pure" examples/hello.pure
            env -u DYLD_LIBRARY_PATH "$INSTALL_PREFIX/bin/pure" -v0100 \
              -c test/batch-smoke.pure -o build/native-batch
            env -u DYLD_LIBRARY_PATH build/native-batch
            file build/native-batch | grep -F "Mach-O"
            test "$(lipo -archs build/native-batch)" = arm64
            otool -L "$INSTALL_PREFIX/bin/pure"
            otool -l "$INSTALL_PREFIX/bin/pure"
            otool -L "$INSTALL_PREFIX/lib/libpure.8.dylib"
            otool -L build/native-batch
            otool -L "$INSTALL_PREFIX/bin/pure" | grep -F "@rpath/libpure.8.dylib"
            otool -l "$INSTALL_PREFIX/bin/pure" | grep -A2 LC_RPATH | \
              grep -F "@loader_path/../lib"
            otool -l build/native-batch | grep -A2 LC_RPATH | \
              grep -F "path $INSTALL_PREFIX/lib/ (offset"
            ! otool -L "$INSTALL_PREFIX/bin/pure" | grep -F "/usr/local/"
            ! otool -L "$INSTALL_PREFIX/lib/libpure.8.dylib" | grep -F "/usr/local/"
            ! otool -L "$INSTALL_PREFIX/bin/pure" | grep -F "$RELEASE_BUILD"
            ! otool -L "$INSTALL_PREFIX/lib/libpure.8.dylib" | grep -F "$RELEASE_BUILD"
            ! otool -L build/native-batch | grep -F "$RELEASE_BUILD"
            PKG_CONFIG_PATH="$installed_pkg_config" pkg-config --modversion pure
            PKG_CONFIG_PATH="$installed_pkg_config" pkg-config --variable=DLL pure
            PKG_CONFIG_PATH="$installed_pkg_config" pkg-config --variable=shared pure
            PKG_CONFIG_PATH="$installed_pkg_config" pkg-config --variable=PIC pure
            test "$(PKG_CONFIG_PATH="$installed_pkg_config" pkg-config --variable=DLL pure)" = .dylib
            test "$(PKG_CONFIG_PATH="$installed_pkg_config" pkg-config --variable=shared pure)" = -dynamiclib
            test "$(PKG_CONFIG_PATH="$installed_pkg_config" pkg-config --variable=PIC pure)" = -fPIC
          } 2>&1 | tee "$LOG_DIR/installed-programs.log"

      - name: Build and load pkg-config module
        working-directory: pure/examples/hellomod
        run: |
          set -euxo pipefail
          installed_pkg_config="$INSTALL_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          PKG_CONFIG_PATH="$installed_pkg_config" make clean
          PKG_CONFIG_PATH="$installed_pkg_config" \
            make CC="$LLVM_PREFIX/bin/clang" \
            2>&1 | tee "../../$LOG_DIR/pkg-config-module.log"
          env -u DYLD_LIBRARY_PATH PATH="$INSTALL_PREFIX/bin:$PATH" \
            "$INSTALL_PREFIX/bin/pure" -L . hello.pure \
            2>&1 | tee -a "../../$LOG_DIR/pkg-config-module.log"
          PKG_CONFIG_PATH="$installed_pkg_config" make clean

      - name: Configure and test Debug
        run: |
          set -euxo pipefail
          cmake -S . -B "$DEBUG_BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DPURE_STRICT_TOOLCHAIN=ON \
            2>&1 | tee "$LOG_DIR/configure-debug.log"
          cmake --build "$DEBUG_BUILD" --parallel 1 \
            2>&1 | tee "$LOG_DIR/build-debug.log"
          ctest --test-dir "$DEBUG_BUILD" -E pure-regression \
            --output-on-failure 2>&1 | tee "$LOG_DIR/ctest-debug-focused.log"

      - name: Validate manifest and idempotent uninstall
        run: |
          set -euxo pipefail
          cp "$RELEASE_BUILD/install_manifest.txt" "$LOG_DIR/install_manifest.txt"
          awk -v prefix="$INSTALL_PREFIX/" \
            'index($0, prefix) != 1 { print "Path escapes prefix: " $0; bad=1 } END { exit bad }' \
            "$RELEASE_BUILD/install_manifest.txt"
          for required in \
            "$INSTALL_PREFIX/bin/pure" \
            "$INSTALL_PREFIX/lib/libpure.8.dylib" \
            "$INSTALL_PREFIX/include/pure/runtime.h" \
            "$INSTALL_PREFIX/lib/pure/pure_main.o" \
            "$INSTALL_PREFIX/lib/pure/prelude.pure" \
            "$INSTALL_PREFIX/lib/pkgconfig/pure.pc"; do
            test -e "$required"
            grep -Fx "$required" "$RELEASE_BUILD/install_manifest.txt"
          done
          cmake --build "$RELEASE_BUILD" --target uninstall \
            2>&1 | tee "$LOG_DIR/uninstall-first.log"
          cmake --build "$RELEASE_BUILD" --target uninstall \
            2>&1 | tee "$LOG_DIR/uninstall-second.log"
          test -z "$(find "$INSTALL_PREFIX" \( -type f -o -type l \) -print)"

      - name: Upload native validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-15-arm64-native-validation
          path: pure/build/native-logs/macos-15-arm64
          if-no-files-found: warn
