      - "pure/todo/TODO-24-windows-pure-mpfr.md"
      - "pure/todo/TODO-25-windows-pure-sockets.md"
      - "pure/todo/TODO-26-windows-pure-sql3.md"
      - "pure/todo/TODO-27-windows-pure-stldict.md"
      - "pure/todo/TODO-28-windows-pure-stllib.md"
