      - "docs/superpowers/specs/2026-09-11-windows-pure-gl-audit-hardening-design.md"
      - "docs/superpowers/plans/2026-09-12-windows-pure-gl-audit-hardening.md"
      - "pure/todo/TODO-34-windows-pure-midi.md"
      - "pure/todo/TODO-33-windows-pure-audio.md"
      - "purepad/**"
      - "pure/todo/TODO-45-windows-pure-bonjour.md"
      - "pure/todo/TODO-20-modernize-purepad.md"
      - "pure/todo/TODO-21-windows-pure-rational.md"
      - "pure/todo/TODO-22-windows-pure-csv.md"
