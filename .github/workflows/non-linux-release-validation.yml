          $repo = (Get-Location).Path
          $source = [IO.Path]::GetFullPath((Join-Path $repo '../pure-glpk'))
          $purePrefix = [IO.Path]::GetFullPath($env:INSTALL_PREFIX)
          $build = [IO.Path]::GetFullPath($env:PURE_GLPK_BUILD)
          $stage = [IO.Path]::GetFullPath('build/staged pure-glpk package')
          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path "$purePrefix/*" -Destination $stage -Recurse
          & $env:CMAKE_EXE --install $build --prefix $stage --component runtime
          if ($LASTEXITCODE -ne 0) { throw 'pure-glpk runtime install failed' }
          & $env:CMAKE_EXE --install $build --prefix $stage --component documentation
          if ($LASTEXITCODE -ne 0) { throw 'pure-glpk documentation install failed' }
          Remove-Item Env:PURELIB -ErrorAction SilentlyContinue
          $env:Path = "$stage/bin;$env:SystemRoot/System32/WindowsPowerShell/v1.0;$env:SystemRoot/System32;$env:SystemRoot"
          if ($env:Path -match '(?i)(^|;).*[/\\]msys64[/\\]') {
            throw "MSYS2 path survived sanitization: $env:Path"
